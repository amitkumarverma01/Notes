trigger:
  branches:
    include:
      - main
variables:
  imageName: 'nginx-app'
  tag: 'latest'
stages:
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image to ACR'
    jobs:
      - job: Build
        pool: agent_007
        steps:
          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              containerRegistry: 'nginx-ACR-connection'     # 👈 ACR service connection
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: '$(tag)'
  
  
  - stage: DeployToAKS
    displayName: 'Deploy to AKS Cluster'
    dependsOn: BuildAndPush
    jobs:
      - job: Deploy
        displayName: 'Deploy to AKS'
        pool: agent_007   # Agar tu hosted agent use kar raha hai. Agar 'agent_007' custom hai to use rehne de.
        steps:
          - task: AzureCLI@2
            displayName: 'Set AKS Context'
            inputs:
              azureSubscription: 'nginx'   # 👈 Azure service connection ka naam
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials --resource-group aks_rg --name aksnew --overwrite-existing

          - task: Kubernetes@1
            displayName: 'Deploy NGINX to AKS'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: 'nginx'
              azureResourceGroup: 'aks_rg'
              kubernetesCluster: 'aksnew'
              command: apply
              useConfigurationFile: true
              configuration: 'deploy/nginx-deployment.yaml'

